name: Portfolio identity maintenance

# Manual-only safety workflow. Normal edits must not trigger a rebuild.
# Current live generation is V3 identity + Responsive V4 + Touch V5.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current responsive/touch portfolio state
        run: |
          python scripts/finalize_portfolio_identity.py
          python scripts/refine_responsive_v4.py
          python scripts/refine_touch_v5.py
      - name: Commit intentional maintenance update
        run: |
          if git diff --quiet -- index.html projects/netdes/index.html; then
            echo "Portfolio identity already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/netdes/index.html
          git commit -m "Maintain responsive touch portfolio state"
          git push
