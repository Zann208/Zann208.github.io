name: Portfolio content refresh

on:
  push:
    paths:
      - 'scripts/refresh_portfolio.py'
      - 'scripts/add_ieee_membership.py'
      - 'scripts/add_resume_portal.py'
      - 'scripts/fix_resume_spacing.py'
      - '.github/workflows/portfolio-content-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh portfolio content
        run: |
          python scripts/refresh_portfolio.py
          python scripts/add_ieee_membership.py
          python scripts/add_resume_portal.py
          python scripts/fix_resume_spacing.py
      - name: Commit portfolio update
        run: |
          if git diff --quiet -- index.html; then
            echo "No portfolio changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix resume preview spacing"
          git push
