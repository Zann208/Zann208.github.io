name: Portfolio touch interaction refinement

# Temporary one-shot trigger for the approved mobile touch-feedback pass.
on:
  push:
    paths:
      - 'scripts/refine_touch_v5.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Touch V5 to current Responsive V4 baseline
        run: python scripts/refine_touch_v5.py
      - name: Commit touch interaction refinement
        run: |
          if git diff --quiet -- index.html; then
            echo "Touch feedback already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply mobile touch interaction V5"
          git push
