name: Portfolio content refresh

# Maintenance workflow only. Run this manually when intentionally rebuilding the
# portfolio from the helper scripts. Normal content edits must not rewrite index.html.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh portfolio content
        run: |
          python scripts/refresh_portfolio.py
          python scripts/add_ieee_membership.py
          python scripts/add_resume_portal.py
          python scripts/fix_resume_spacing.py
          python scripts/enhance_resume_visibility.py
          python scripts/networking_first_refresh.py
          python scripts/repair_i18n.py
          python scripts/fix_resume_contact.py
          python scripts/monochrome_repolish.py
          python scripts/visual_hierarchy_polish.py
          python scripts/recruiter_polish.py
          python scripts/sync_resume_preview.py
          # Faculty accent stays last so black/white remains the base and burgundy is only the final identity layer.
          python scripts/faculty_accent.py
      - name: Commit portfolio update
        run: |
          if git diff --quiet -- index.html; then
            echo "No portfolio changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh portfolio with Engineering CMU accent"
          git push
