name: Portfolio identity maintenance

# Manual-only safety workflow. Normal content edits should not rebuild the
# portfolio. Run only when intentionally reapplying the canonical design system.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical portfolio identity
        run: |
          python scripts/apply_portfolio_identity.py
          python scripts/finalize_portfolio_identity.py
          python scripts/refine_portfolio_v3.py
      - name: Commit intentional maintenance update
        run: |
          if git diff --quiet -- index.html projects/netdes/index.html; then
            echo "Portfolio identity already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/netdes/index.html
          git commit -m "Maintain portfolio identity system"
          git push
