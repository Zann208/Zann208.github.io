name: Portfolio V3 refinement

# Temporary one-shot refinement trigger. The push trigger is limited to the V3
# refinement script so generated portfolio commits cannot loop.
on:
  push:
    paths:
      - 'scripts/refine_portfolio_v3.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V3 portfolio refinement
        run: |
          python scripts/apply_portfolio_identity.py
          python scripts/finalize_portfolio_identity.py
          python scripts/refine_portfolio_v3.py
      - name: Commit V3 refinement
        run: |
          if git diff --quiet -- index.html projects/netdes/index.html; then
            echo "Portfolio already refined"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/netdes/index.html
          git commit -m "Refine portfolio interactions and credentials"
          git push
