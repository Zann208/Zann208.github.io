name: Portfolio V3 refinement

# Temporary one-shot trigger for the approved refinement pass. The push trigger
# is limited to the refinement script so generated portfolio commits cannot loop.
on:
  push:
    paths:
      - 'scripts/refine_portfolio_v3.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V3 portfolio refinements
        run: python scripts/refine_portfolio_v3.py
      - name: Commit approved portfolio refinements
        run: |
          if git diff --quiet -- index.html; then
            echo "Portfolio refinements already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply approved portfolio refinements"
          git push
