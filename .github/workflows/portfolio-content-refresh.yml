name: Portfolio identity finalization

# Temporary one-shot finalization trigger. It is limited to the finalizer
# script and will be removed after the generated cleanup commit.
on:
  push:
    paths:
      - 'scripts/finalize_portfolio_identity.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final portfolio cleanup
        run: python scripts/finalize_portfolio_identity.py
      - name: Commit final cleanup
        run: |
          if git diff --quiet -- index.html projects/netdes/index.html; then
            echo "Portfolio already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/netdes/index.html
          git commit -m "Finish multilingual portfolio cleanup"
          git push
