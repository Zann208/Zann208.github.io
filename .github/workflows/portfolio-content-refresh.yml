name: Portfolio identity migration

# Temporary one-shot migration runner. The push trigger is limited to the
# migration script itself so generated portfolio commits cannot loop.
on:
  push:
    paths:
      - 'scripts/apply_portfolio_identity.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply authored portfolio identity
        run: python scripts/apply_portfolio_identity.py
      - name: Commit migrated portfolio
        run: |
          if git diff --quiet -- index.html projects/netdes/index.html; then
            echo "Portfolio already migrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/netdes/index.html
          git commit -m "Refactor portfolio into infrastructure dossier"
          git push
