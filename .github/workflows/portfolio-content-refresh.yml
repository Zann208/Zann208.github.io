name: Portfolio content refresh

on:
  push:
    paths:
      - 'scripts/refresh_portfolio.py'
      - 'scripts/add_ieee_membership.py'
      - 'scripts/add_resume_portal.py'
      - 'scripts/fix_resume_spacing.py'
      - 'scripts/enhance_resume_visibility.py'
      - 'scripts/networking_first_refresh.py'
      - 'scripts/repair_i18n.py'
      - 'scripts/fix_resume_contact.py'
      - 'scripts/monochrome_repolish.py'
      - '.github/workflows/portfolio-content-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh portfolio content
        run: |
          python scripts/refresh_portfolio.py
          python scripts/add_ieee_membership.py
          python scripts/add_resume_portal.py
          python scripts/fix_resume_spacing.py
          python scripts/enhance_resume_visibility.py
          python scripts/networking_first_refresh.py
          python scripts/repair_i18n.py
          python scripts/fix_resume_contact.py
          python scripts/monochrome_repolish.py
      - name: Commit portfolio update
        run: |
          if git diff --quiet -- index.html; then
            echo "No portfolio changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repolish portfolio in monochrome"
          git push
