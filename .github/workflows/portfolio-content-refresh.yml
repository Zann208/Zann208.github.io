name: Portfolio responsive refinement

# Temporary one-shot trigger for the approved responsive/input pass. The push
# trigger is limited to the responsive script so generated commits cannot loop.
on:
  push:
    paths:
      - 'scripts/refine_responsive_v4.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve V3 identity and apply responsive V4
        run: |
          python scripts/finalize_portfolio_identity.py
          python scripts/refine_portfolio_v3.py
          python scripts/refine_responsive_v4.py
      - name: Commit responsive portfolio
        run: |
          if git diff --quiet -- index.html projects/netdes/index.html; then
            echo "Responsive portfolio already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/netdes/index.html
          git commit -m "Apply responsive V4 portfolio refinement"
          git push
