name: Resume preview sync

# Manual-only maintenance. Rebuild the resume preview, then preserve the current
# responsive/touch generation. Do not replay the older V3 migration refiner.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync resume and preserve Responsive V4 + Touch V5
        run: |
          python scripts/sync_resume_preview.py
          python scripts/finalize_portfolio_identity.py
          python scripts/refine_responsive_v4.py
          python scripts/refine_touch_v5.py
      - name: Commit resume preview
        run: |
          if git diff --quiet -- index.html projects/netdes/index.html; then
            echo "Resume preview already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/netdes/index.html
          git commit -m "Sync resume with responsive touch portfolio"
          git push
