name: Resume preview sync

# Manual-only maintenance. Rebuild the resume preview, then immediately reapply
# the canonical portfolio identity so resume work cannot restore legacy styling.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply resume preview and canonical identity
        run: |
          python scripts/sync_resume_preview.py
          python scripts/apply_portfolio_identity.py
      - name: Commit resume preview
        run: |
          if git diff --quiet -- index.html projects/netdes/index.html; then
            echo "Resume preview already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects/netdes/index.html
          git commit -m "Sync resume preview with portfolio identity"
          git push
