name: Resume preview sync

# Maintenance workflow only. Run manually after intentionally changing the
# resume-generation helpers. It must not rewrite the portfolio after every
# index.html edit.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean resume preview
        run: |
          python scripts/sync_resume_preview.py
          python scripts/faculty_accent.py
      - name: Commit resume preview
        run: |
          if git diff --quiet -- index.html; then
            echo "Resume preview already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply clean resume with Engineering CMU accent"
          git push
